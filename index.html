Sengoku Otome<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>血圧記録 - 診察用最適化版</title>
    
    <meta name="theme-color" content="#764ba2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <style>
        /* --- 基本レイアウト --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 10px; }
        .header h1 { font-size: 1.4rem; }

        .input-card {
            background: white; border-radius: 16px; padding: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); margin-bottom: 15px;
        }
        .date-input {
            width: 100%; padding: 10px; border: 2px solid #e5e7eb;
            border-radius: 10px; font-size: 1.1rem; text-align: center; margin-bottom: 12px; font-weight: bold;
        }

        .area-morning { background-color: #fffaf0; border-radius: 12px; padding: 10px; margin-bottom: 12px; border: 1px solid #ffeeba; }
        .area-evening { background-color: #f0f7ff; border-radius: 12px; padding: 10px; margin-bottom: 12px; border: 1px solid #bee5eb; }

        .section-title { font-size: 1rem; font-weight: bold; margin-bottom: 8px; text-align: center; }
        .morning-text { color: #d68910; }
        .evening-text { color: #2e86de; }

        .stepper-row { display: flex; align-items: center; justify-content: center; gap: 4px; margin-bottom: 8px; }
        .reading-num { font-size: 0.8rem; font-weight: bold; background: #eee; padding: 4px 6px; border-radius: 4px; }
        .value-control { display: flex; align-items: center; gap: 2px; }
        .step-btn { width: 30px; height: 36px; border: 1px solid #ccc; background: white; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .value-control select { width: 62px; height: 36px; border: 1px solid #ccc; border-radius: 4px; font-size: 1.1rem; font-weight: bold; text-align: center; }
        
        .pulse-label { font-size: 0.7rem; color: #666; margin-left: 2px; }

        .save-button {
            width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; cursor: pointer;
        }
        .tool-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .tool-btn { padding: 10px 5px; border-radius: 8px; border: none; color: white; font-weight: bold; font-size: 0.8rem; cursor: pointer; }
        .btn-print { background: #10b981; }
        .btn-export { background: #f39c12; }
        .btn-import { background: #7f8c8d; }

        .history-section { background: white; border-radius: 16px; padding: 15px; min-height: 150px; }
        .history-item { border-bottom: 1px solid #eee; }
        .history-summary { display: grid; grid-template-columns: 60px 1fr 1fr 40px; align-items: center; padding: 12px 0; cursor: pointer; }
        .history-date { font-weight: bold; color: #555; }
        .sum-val { font-size: 1.1rem; font-weight: bold; text-align: center; }
        .delete-btn { background: #ffeded; color: #eb4d4b; border: none; border-radius: 6px; padding: 6px; cursor: pointer; }
        
        .history-details {
            max-height: 0; overflow: hidden; background: #f8f9fa; transition: max-height 0.3s;
            text-align: center; font-size: 0.85rem; color: #555;
        }
        .history-item.open .history-details { max-height: 130px; padding: 10px 0; border-top: 1px dashed #ccc; }
        
        .reflect-btn {
            margin-top: 8px; padding: 8px 15px; background: #667eea; color: white;
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
        }

        /* 印刷設定用ダイアログ */
        .print-dialog-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7); z-index: 1000; align-items: center; justify-content: center; padding: 20px;
        }
        .print-dialog { background: white; border-radius: 16px; padding: 20px; max-width: 400px; width: 100%; }

        /* --- 印刷用設定 (A4 / 4週間 1枚 平均値特化版) --- */
        #printContainer { display: none; }
        @media print {
            body > .container { display: none !important; }
            #printContainer { display: block !important; position: absolute; left: 0; top: 0; width: 100%; background: white; color: black; }
            @page { size: A4; margin: 10mm; }
            
            .print-page { 
                page-break-after: always; 
                display: grid; 
                grid-template-columns: 1fr 1fr; 
                grid-template-rows: 1fr 1fr; 
                gap: 5mm; 
                height: 275mm; 
                box-sizing: border-box;
            }
            
            .week-group { 
                border: 2px solid #333; 
                border-radius: 4px;
                display: flex; 
                flex-direction: column; 
                overflow: hidden;
                box-sizing: border-box;
            }
            
            .weekly-summary { 
                background: #f8f9fa; border-bottom: 2px solid #333; padding: 3mm; 
                text-align: center; font-weight: bold;
            }
            .week-title { font-size: 10pt; color: #333; margin-bottom: 1.5mm; }
            .avg-row { display: flex; justify-content: space-around; align-items: center; }
            .avg-item { line-height: 1.2; text-align: center; }
            .avg-label { font-size: 9pt; color: #555; display: block; margin-bottom: 2px; }
            .avg-val-large { font-size: 15pt; letter-spacing: -0.5pt; font-family: sans-serif; } 
            .avg-pulse { font-size: 9pt; color: #555; }
            
            .day-row { 
                display: grid; 
                grid-template-columns: 16mm 1fr; 
                border-bottom: 1px solid #ccc; 
                flex: 1; 
                align-items: stretch; 
            }
            .day-row:last-child { border-bottom: none; } 

            .day-date { 
                font-size: 10.5pt;
                font-weight: bold; 
                text-align: center; 
                background: #f8f9fa;
                border-right: 1px solid #ccc; 
                display: flex; 
                flex-direction: column; 
                align-items: center; 
                justify-content: center; 
            }
            .day-values { 
                display: grid; 
                grid-template-columns: 1fr 1fr; 
                text-align: center; 
            }
            .val-cell {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 1mm;
            }
            .val-m { border-right: 1px dashed #aaa; }
            
            /* 日々の平均値（メイン）と脈拍（サブ）のフォント設定 */
            .bp-main { font-size: 13.5pt; font-weight: bold; line-height: 1.2; margin-bottom: 2mm; }
            .bp-sub { font-size: 10.5pt; font-weight: bold; color: #444; line-height: 1.2; }
            
            .prefix-text { font-size: 9pt; font-weight: normal; color: #666; margin-right: 2px; vertical-align: middle; }
            .suffix-text { font-size: 8.5pt; font-weight: normal; color: #666; margin-left: 2px; }

            .val-m .bp-main { color: #b66a00; } 
            .val-m .bp-sub { color: #b66a00; } 
            .val-e .bp-main { color: #1a5ca3; } 
            .val-e .bp-sub { color: #1a5ca3; } 
        }
    </style>
</head>
<body>

<div class="container" id="top">
    <div class="header"><h1>🩺 血圧記録</h1></div>

    <div class="input-card">
        <input type="date" id="record_date" class="date-input">

        <div class="area-morning">
            <div class="section-title morning-text">☀️ 朝の測定</div>
            <div class="stepper-row">
                <div class="reading-num">①</div>
                <div class="value-control">
                    <button class="step-btn" onclick="step('m1_sys', -1)">-</button>
                    <select id="m1_sys"></select>
                    <button class="step-btn" onclick="step('m1_sys', 1)">+</button>
                </div>
                <div class="value-control">
                    <button class="step-btn" onclick="step('m1_dia', -1)">-</button>
                    <select id="m1_dia"></select>
                    <button class="step-btn" onclick="step('m1_dia', 1)">+</button>
                </div>
                <div class="value-control">
                    <span class="pulse-label">脈</span>
                    <select id="m1_pulse" style="width:55px;"></select>
                </div>
            </div>
            <div class="stepper-row">
                <div class="reading-num">②</div>
                <div class="value-control">
                    <button class="step-btn" onclick="step('m2_sys', -1)">-</button>
                    <select id="m2_sys"></select>
                    <button class="step-btn" onclick="step('m2_sys', 1)">+</button>
                </div>
                <div class="value-control">
                    <button class="step-btn" onclick="step('m2_dia', -1)">-</button>
                    <select id="m2_dia"></select>
                    <button class="step-btn" onclick="step('m2_dia', 1)">+</button>
                </div>
                <div class="value-control">
                    <span class="pulse-label">脈</span>
                    <select id="m2_pulse" style="width:55px;"></select>
                </div>
            </div>
        </div>

        <div class="area-evening">
            <div class="section-title evening-text">🌙 夜の測定</div>
            <div class="stepper-row">
                <div class="reading-num">①</div>
                <div class="value-control">
                    <button class="step-btn" onclick="step('e1_sys', -1)">-</button>
                    <select id="e1_sys"></select>
                    <button class="step-btn" onclick="step('e1_sys', 1)">+</button>
                </div>
                <div class="value-control">
                    <button class="step-btn" onclick="step('e1_dia', -1)">-</button>
                    <select id="e1_dia"></select>
                    <button class="step-btn" onclick="step('e1_dia', 1)">+</button>
                </div>
                <div class="value-control">
                    <span class="pulse-label">脈</span>
                    <select id="e1_pulse" style="width:55px;"></select>
                </div>
            </div>
            <div class="stepper-row">
                <div class="reading-num">②</div>
                <div class="value-control">
                    <button class="step-btn" onclick="step('e2_sys', -1)">-</button>
                    <select id="e2_sys"></select>
                    <button class="step-btn" onclick="step('e2_sys', 1)">+</button>
                </div>
                <div class="value-control">
                    <button class="step-btn" onclick="step('e2_dia', -1)">-</button>
                    <select id="e2_dia"></select>
                    <button class="step-btn" onclick="step('e2_dia', 1)">+</button>
                </div>
                <div class="value-control">
                    <span class="pulse-label">脈</span>
                    <select id="e2_pulse" style="width:55px;"></select>
                </div>
            </div>
        </div>

        <button class="save-button" onclick="addRecord()">💾 記録を保存</button>

        <div class="tool-buttons">
            <button class="tool-btn btn-print" onclick="showPrintDialog()">🖨️ 印刷</button>
            <button class="tool-btn btn-export" onclick="exportToCSV()">📊 出力</button>
            <button class="tool-btn btn-import" onclick="document.getElementById('csvFile').click()">📥 取込</button>
        </div>
        <input type="file" id="csvFile" style="display:none" onchange="importFromCSV(this)">
    </div>

    <div class="history-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="font-size: 0.9rem; margin: 0;">📋 履歴 (タップで詳細)</h3>
            <select id="historyMonthSelect" style="padding: 4px 8px; border-radius: 6px; border: 1px solid #ccc; font-weight: bold; background: #f8f9fa; font-size: 0.9rem;" onchange="onMonthChange()"></select>
        </div>
        <div id="historyList"></div>
    </div>
</div>

<div class="print-dialog-overlay" id="printDialog">
    <div class="print-dialog">
        <h3 style="margin-bottom:15px;">🖨️ 印刷設定</h3>
        <div style="margin-bottom:12px;">
            <label>開始日</label><input type="date" id="printStartDate" class="date-input" style="margin-top:5px;">
        </div>
        <div style="margin-bottom:12px;">
            <label>終了日</label><input type="date" id="printEndDate" class="date-input" style="margin-top:5px;">
        </div>
        <div class="tool-buttons">
            <button class="tool-btn" style="background:#eee;color:black;" onclick="closePrintDialog()">閉じる</button>
            <button class="tool-btn btn-print" style="grid-column: span 2;" onclick="executePrint()">印刷実行</button>
        </div>
    </div>
</div>

<div id="printContainer"></div>

<script>
    let records = JSON.parse(localStorage.getItem('bp_records_integrated')) || [];
    let currentSelectedMonth = ""; // 追加: 表示中の月を保持

    function createOptions(id, min, max, def) {
        const sel = document.getElementById(id);
        if(!sel) return;
        sel.innerHTML = '';
        for(let i=max; i>=min; i--) {
            const opt = document.createElement('option');
            opt.value = i; opt.textContent = i;
            if(i === def) opt.selected = true;
            sel.appendChild(opt);
        }
    }

    ['m1','m2','e1','e2'].forEach(p => {
        createOptions(p+'_sys', 70, 220, 125);
        createOptions(p+'_dia', 40, 140, 80);
        createOptions(p+'_pulse', 40, 140, 70);
    });

    const today = new Date();
    document.getElementById('record_date').value = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');

    function step(id, val) {
        const el = document.getElementById(id);
        const nextVal = parseInt(el.value) + val;
        const opt = el.querySelector(`option[value="${nextVal}"]`);
        if(opt) el.value = nextVal;
    }

    function addRecord() {
        const dateVal = document.getElementById('record_date').value;
        const entry = {
            id: Date.now(),
            fullDate: dateVal,
            m1: [parseInt(document.getElementById('m1_sys').value), parseInt(document.getElementById('m1_dia').value), parseInt(document.getElementById('m1_pulse').value)],
            m2: [parseInt(document.getElementById('m2_sys').value), parseInt(document.getElementById('m2_dia').value), parseInt(document.getElementById('m2_pulse').value)],
            e1: [parseInt(document.getElementById('e1_sys').value), parseInt(document.getElementById('e1_dia').value), parseInt(document.getElementById('e1_pulse').value)],
            e2: [parseInt(document.getElementById('e2_sys').value), parseInt(document.getElementById('e2_dia').value), parseInt(document.getElementById('e2_pulse').value)]
        };
        records = records.filter(r => r.fullDate !== dateVal);
        records.unshift(entry);
        records.sort((a,b) => new Date(b.fullDate) - new Date(a.fullDate));
        
        // 追加: 保存したデータの月を「選択中の月」としてセットする
        const parts = dateVal.split('-');
        currentSelectedMonth = `${parts[0]}-${String(parts[1]).padStart(2, '0')}`;
        
        saveAndRender();
        alert('保存しました');
    }

    function loadToInputs(id) {
        const r = records.find(item => item.id === id);
        if (!r) return;
        if (confirm(`${r.fullDate} のデータを入力欄に反映しますか？`)) {
            document.getElementById('record_date').value = r.fullDate;
            const setVal = (id, val) => { if(val !== undefined) document.getElementById(id).value = val; };
            setVal('m1_sys', r.m1[0]); setVal('m1_dia', r.m1[1]); setVal('m1_pulse', r.m1[2]);
            setVal('m2_sys', r.m2[0]); setVal('m2_dia', r.m2[1]); setVal('m2_pulse', r.m2[2]);
            setVal('e1_sys', r.e1[0]); setVal('e1_dia', r.e1[1]); setVal('e1_pulse', r.e1[2]);
            setVal('e2_sys', r.e2[0]); setVal('e2_dia', r.e2[1]); setVal('e2_pulse', r.e2[2]);
            document.getElementById('top').scrollIntoView({behavior: 'smooth'});
        }
    }

    function saveAndRender() {
        localStorage.setItem('bp_records_integrated', JSON.stringify(records));
        renderHistory();
    }

    // --- 追加機能: 月選択プルダウンの構築 ---
    function updateMonthSelect() {
        const select = document.getElementById('historyMonthSelect');
        let currentVal = currentSelectedMonth || select.value; 
        select.innerHTML = '';
        
        if (records.length === 0) {
            const opt = document.createElement('option');
            opt.value = "";
            opt.textContent = "データなし";
            select.appendChild(opt);
            return;
        }

        const months = new Set();
        records.forEach(r => {
            const parts = r.fullDate.split('-');
            months.add(`${parts[0]}-${String(parts[1]).padStart(2, '0')}`);
        });

        const sortedMonths = Array.from(months).sort().reverse();

        sortedMonths.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            const parts = m.split('-');
            opt.textContent = `${parts[0]}年${parseInt(parts[1])}月`;
            select.appendChild(opt);
        });

        // 現在選択中の月があれば維持、なければ最新の月を選択
        if (currentVal && sortedMonths.includes(currentVal)) {
            select.value = currentVal;
        } else {
            select.value = sortedMonths[0]; 
        }
        currentSelectedMonth = select.value;
    }

    function onMonthChange() {
        currentSelectedMonth = document.getElementById('historyMonthSelect').value;
        renderHistory();
    }

    // --- 変更: 指定された月のみフィルタリングして表示 ---
    function renderHistory() {
        updateMonthSelect(); // プルダウンを最新化

        const list = document.getElementById('historyList');
        const selectedMonth = document.getElementById('historyMonthSelect').value;

        if (records.length === 0) {
            list.innerHTML = '<div style="text-align:center;color:#999;padding:20px;">データがありません</div>';
            return;
        }

        // 月でフィルタリング
        const filteredRecords = records.filter(r => {
            const parts = r.fullDate.split('-');
            const rMonth = `${parts[0]}-${String(parts[1]).padStart(2, '0')}`;
            return rMonth === selectedMonth;
        });

        if (filteredRecords.length === 0) {
            list.innerHTML = '<div style="text-align:center;color:#999;padding:20px;">この月のデータはありません</div>';
            return;
        }

        list.innerHTML = filteredRecords.map(r => {
            const dParts = r.fullDate.split('-');
            const p = (val) => val || '--';
            return `
                <div class="history-item" onclick="this.classList.toggle('open')">
                    <div class="history-summary">
                        <div class="history-date">${parseInt(dParts[1])}/${parseInt(dParts[2])}</div>
                        <div class="sum-val morning-text">${r.m1[0]}/${r.m1[1]}</div>
                        <div class="sum-val evening-text">${r.e1[0]}/${r.e1[1]}</div>
                        <button class="delete-btn" onclick="event.stopPropagation(); deleteRecord(${r.id})">×</button>
                    </div>
                    <div class="history-details">
                        <p>朝②: ${r.m2[0]}/${r.m2[1]} (脈:${p(r.m2[2])}) | 夜②: ${r.e2[0]}/${r.e2[1]} (脈:${p(r.e2[2])})</p>
                        <p>脈拍① 朝:${p(r.m1[2])} / 夜:${p(r.e1[2])}</p>
                        <button class="reflect-btn" onclick="event.stopPropagation(); loadToInputs(${r.id})">このデータを入力欄に戻す</button>
                    </div>
                </div>`;
        }).join('');
    }

    function deleteRecord(id) {
        if(confirm('この記録を削除しますか？')) {
            records = records.filter(r => r.id !== id);
            saveAndRender();
        }
    }

    function exportToCSV() {
        let csv = "日付,朝1高,朝1低,朝1脈,朝2高,朝2低,朝2脈,夜1高,夜1低,夜1脈,夜2高,夜2低,夜2脈\n";
        records.forEach(r => {
            csv += `${r.fullDate},${r.m1[0]},${r.m1[1]},${r.m1[2]||''},${r.m2[0]},${r.m2[1]},${r.m2[2]||''},${r.e1[0]},${r.e1[1]},${r.e1[2]||''},${r.e2[0]},${r.e2[1]},${r.e2[2]||''}\n`;
        });
        const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], {type:'text/csv;charset=utf-8'});
        const a = document.createElement('a');
        const now = new Date();
        a.download = `血圧 ${now.getMonth()+1}月 ${now.getDate()}日保存.csv`;
        a.href = URL.createObjectURL(blob);
        a.click();
    }

    function importFromCSV(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const lines = e.target.result.split(/\r\n|\n/);
            let count = 0;
            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(',');
                if (cols.length < 9) continue;
                const n = (v) => { const x = parseInt(v); return isNaN(x) ? 0 : x; };
                const entry = {
                    id: Date.now() + i,
                    fullDate: cols[0].trim(),
                    m1: [n(cols[1]), n(cols[2]), n(cols[3])],
                    m2: [n(cols[4]), n(cols[5]), n(cols[6])],
                    e1: [n(cols[7]), n(cols[8]), n(cols[9])],
                    e2: [n(cols[10]), n(cols[11]), n(cols[12])]
                };
                records = records.filter(r => r.fullDate !== entry.fullDate);
                records.push(entry);
                count++;
            }
            records.sort((a,b) => new Date(b.fullDate) - new Date(a.fullDate));
            saveAndRender();
            alert(`${count}件取り込みました`);
        };
        reader.readAsText(file);
    }

    function showPrintDialog() {
        document.getElementById('printDialog').style.display = 'flex';
        if (records.length > 0) {
            const dates = records.map(r => new Date(r.fullDate.replace(/-/g, '/') + " 00:00:00").getTime());
            document.getElementById('printStartDate').value = new Date(Math.min(...dates)).toISOString().split('T')[0];
            document.getElementById('printEndDate').value = new Date(Math.max(...dates)).toISOString().split('T')[0];
        }
    }
    function closePrintDialog() { document.getElementById('printDialog').style.display = 'none'; }

    // 日付マッチング用正規化関数 (2025-12-1 と 2025-12-01 両方対応)
    function normalizeDate(dStr) {
        if (!dStr) return "";
        const parts = dStr.split('-');
        if (parts.length !== 3) return dStr;
        return `${parts[0]}-${String(parts[1]).padStart(2,'0')}-${String(parts[2]).padStart(2,'0')}`;
    }

    function executePrint() {
        const startVal = document.getElementById('printStartDate').value;
        const endVal = document.getElementById('printEndDate').value;
        if (!startVal || !endVal) return alert('日付を指定してください');

        const start = new Date(startVal.replace(/-/g, '/') + " 00:00:00");
        const end = new Date(endVal.replace(/-/g, '/') + " 00:00:00");
        
        // データを正規化してマップ化 (12-1 と 12-01 の混在を解決)
        const recordMap = {};
        records.forEach(r => recordMap[normalizeDate(r.fullDate)] = r);

        let html = '';
        let current = new Date(start);
        current.setDate(current.getDate() - current.getDay()); // 日曜日に合わせる

        const weeks = [];
        while (current <= end) {
            const week = { start: new Date(current), days: [] };
            for (let i = 0; i < 7; i++) {
                const dStr = normalizeDate(`${current.getFullYear()}-${current.getMonth()+1}-${current.getDate()}`);
                week.days.push({ date: new Date(current), data: recordMap[dStr] || null });
                current.setDate(current.getDate() + 1);
            }
            weeks.push(week);
        }

        // 4週間ごとにページを分ける
        for (let p = 0; p < Math.ceil(weeks.length / 4); p++) {
            html += `<div class="print-page">`;
            weeks.slice(p * 4, (p + 1) * 4).forEach(w => {
                let mSumS = 0, mSumD = 0, mSumP = 0, mCount = 0;
                let eSumS = 0, eSumD = 0, eSumP = 0, eCount = 0;
                
                w.days.forEach(d => { if (d.data) {
                    mSumS += (d.data.m1[0] + d.data.m2[0]) / 2; mSumD += (d.data.m1[1] + d.data.m2[1]) / 2; mSumP += (d.data.m1[2] + d.data.m2[2]) / 2; mCount++;
                    eSumS += (d.data.e1[0] + d.data.e2[0]) / 2; eSumD += (d.data.e1[1] + d.data.e2[1]) / 2; eSumP += (d.data.e1[2] + d.data.e2[2]) / 2; eCount++;
                }});
                
                const avgItem = (label, s, d, p, c, color) => {
                    const val = c > 0 ? `<div style="color:${color};"><span class="avg-val-large">${Math.round(s/c)}/${Math.round(d/c)}</span> <span class="avg-pulse">(脈:${Math.round(p/c)})</span></div>` : '<div class="avg-val-large">--</div>';
                    return `<div class="avg-item"><span class="avg-label">${label}</span>${val}</div>`;
                };

                // 第何週かを計算 (1月1日が含まれる週を第1週とする)
                const sat = new Date(w.start);
                sat.setDate(sat.getDate() + 6); // その週の土曜日を基準にして年を判定
                const jan1 = new Date(sat.getFullYear(), 0, 1);
                const jan1Sun = new Date(jan1);
                jan1Sun.setDate(jan1.getDate() - jan1.getDay()); // 1月1日が含まれる週の日曜日
                const weekNum = Math.round((w.start.getTime() - jan1Sun.getTime()) / 604800000) + 1; // 604800000ms = 7日間

                html += `<div class="week-group">
                    <div class="weekly-summary">
                        <div class="week-title">${w.start.getMonth()+1}/${w.start.getDate()} 週 (第${weekNum}週) の全体平均</div>
                        <div class="avg-row">
                            ${avgItem('朝平均', mSumS, mSumD, mSumP, mCount, '#b66a00')}
                            ${avgItem('夜平均', eSumS, eSumD, eSumP, eCount, '#1a5ca3')}
                        </div>
                    </div>`;
                    
                w.days.forEach(d => {
                    const r = d.data;
                    const dayStr = ['日','月','火','水','木','金','土'][d.date.getDay()];
                    
                    let mHtml = '<div class="val-cell val-m">--</div>';
                    let eHtml = '<div class="val-cell val-e">--</div>';
                    
                    if (r) {
                        // 日々の平均値を計算
                        const mSysAvg = Math.round((r.m1[0] + r.m2[0]) / 2);
                        const mDiaAvg = Math.round((r.m1[1] + r.m2[1]) / 2);
                        const mPlsAvg = Math.round((r.m1[2] + r.m2[2]) / 2);
                        
                        const eSysAvg = Math.round((r.e1[0] + r.e2[0]) / 2);
                        const eDiaAvg = Math.round((r.e1[1] + r.e2[1]) / 2);
                        const ePlsAvg = Math.round((r.e1[2] + r.e2[2]) / 2);

                        mHtml = `<div class="val-cell val-m">
                                    <div class="bp-main"><span class="prefix-text">[平均]</span>${mSysAvg}/${mDiaAvg}</div>
                                    <div class="bp-sub">${mPlsAvg}<span class="suffix-text">[拍/分]</span></div>
                                 </div>`;
                        eHtml = `<div class="val-cell val-e">
                                    <div class="bp-main"><span class="prefix-text">[平均]</span>${eSysAvg}/${eDiaAvg}</div>
                                    <div class="bp-sub">${ePlsAvg}<span class="suffix-text">[拍/分]</span></div>
                                 </div>`;
                    }
                    
                    html += `
                        <div class="day-row">
                            <div class="day-date"><span>${d.date.getMonth()+1}/${d.date.getDate()}</span><span style="font-size:0.8em;">(${dayStr})</span></div>
                            <div class="day-values">
                                ${mHtml}
                                ${eHtml}
                            </div>
                        </div>`;
                });
                html += `</div>`;
            });
            html += `</div>`;
        }
        document.getElementById('printContainer').innerHTML = html;
        closePrintDialog();
        setTimeout(() => { window.print(); }, 500);
    }

    saveAndRender();
</script>
</body>
</html>
