<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>血圧記録 - 診察用最適化版</title>
    
    <meta name="theme-color" content="#764ba2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <style>
        /* --- 基本レイアウト --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 10px; }
        .header h1 { font-size: 1.4rem; }

        .input-card {
            background: white; border-radius: 16px; padding: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); margin-bottom: 15px;
        }
        .date-input {
            width: 100%; padding: 10px; border: 2px solid #e5e7eb;
            border-radius: 10px; font-size: 1.1rem; text-align: center; margin-bottom: 12px; font-weight: bold;
        }

        .area-morning { background-color: #fffaf0; border-radius: 12px; padding: 10px; margin-bottom: 12px; border: 1px solid #ffeeba; }
        .area-evening { background-color: #f0f7ff; border-radius: 12px; padding: 10px; margin-bottom: 12px; border: 1px solid #bee5eb; }

        .section-title { font-size: 1rem; font-weight: bold; margin-bottom: 8px; text-align: center; }
        .morning-text { color: #d68910; }
        .evening-text { color: #2e86de; }

        .stepper-row { display: flex; align-items: center; justify-content: center; gap: 4px; margin-bottom: 8px; }
        .reading-num { font-size: 0.8rem; font-weight: bold; background: #eee; padding: 4px 6px; border-radius: 4px; }
        .value-control { display: flex; align-items: center; gap: 2px; }
        .step-btn { width: 30px; height: 36px; border: 1px solid #ccc; background: white; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .value-control select { width: 62px; height: 36px; border: 1px solid #ccc; border-radius: 4px; font-size: 1.1rem; font-weight: bold; text-align: center; }
        
        .pulse-label { font-size: 0.7rem; color: #666; margin-left: 2px; }

        .save-button {
            width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; cursor: pointer;
        }
        .tool-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .tool-btn { padding: 10px 5px; border-radius: 8px; border: none; color: white; font-weight: bold; font-size: 0.8rem; cursor: pointer; }
        .btn-print { background: #10b981; }
        .btn-export { background: #f39c12; }
        .btn-import { background: #7f8c8d; }
        .storage-status {
            margin-top: 10px; padding: 8px 10px; border-radius: 8px;
            background: #f3f4f6; color: #4b5563; font-size: 0.75rem; line-height: 1.5;
            text-align: center;
        }
        .storage-status.warning { background: #fff7ed; color: #9a3412; }
        .storage-status.error { background: #fef2f2; color: #b91c1c; }

        .history-section { background: white; border-radius: 16px; padding: 15px; min-height: 150px; }
        .history-item { border-bottom: 1px solid #eee; }
        .history-summary { display: grid; grid-template-columns: 60px 1fr 1fr 40px; align-items: center; padding: 12px 0; cursor: pointer; }
        .history-date { font-weight: bold; color: #555; }
        .sum-val { font-size: 1.1rem; font-weight: bold; text-align: center; }
        .delete-btn { background: #ffeded; color: #eb4d4b; border: none; border-radius: 6px; padding: 6px; cursor: pointer; }
        
        .history-details {
            max-height: 0; overflow: hidden; background: #f8f9fa; transition: max-height 0.3s;
            text-align: center; font-size: 0.85rem; color: #555;
        }
        .history-item.open .history-details { max-height: 130px; padding: 10px 0; border-top: 1px dashed #ccc; }
        
        .reflect-btn {
            margin-top: 8px; padding: 8px 15px; background: #667eea; color: white;
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
        }

        /* 印刷設定用ダイアログ */
        .print-dialog-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7); z-index: 1000; align-items: center; justify-content: center; padding: 20px;
        }
        .print-dialog { background: white; border-radius: 16px; padding: 20px; max-width: 400px; width: 100%; }

        /* --- 印刷用設定 (A4 / 4週間 1枚 平均値特化版) --- */
        #printContainer { display: none; }
        @media print {
            body > .container { display: none !important; }
            #printContainer { display: block !important; position: absolute; left: 0; top: 0; width: 100%; background: white; color: black; }
            @page { size: A4; margin: 10mm; }
            
            .print-page { 
                page-break-after: always; 
                display: grid; 
                grid-template-columns: 1fr 1fr; 
                grid-template-rows: 1fr 1fr; 
                gap: 5mm; 
                height: 275mm; 
                box-sizing: border-box;
            }
            .print-page:last-child { page-break-after: auto; }
            
            .week-group { 
                border: 2px solid #333; 
                border-radius: 4px;
                display: flex; 
                flex-direction: column; 
                overflow: hidden;
                box-sizing: border-box;
            }
            
            .weekly-summary { 
                background: #f8f9fa; border-bottom: 2px solid #333; padding: 3mm; 
                text-align: center; font-weight: bold;
            }
            .week-title { font-size: 10pt; color: #333; margin-bottom: 1.5mm; }
            .avg-row { display: flex; justify-content: space-around; align-items: center; }
            .avg-item { line-height: 1.2; text-align: center; }
            .avg-label { font-size: 9pt; color: #555; display: block; margin-bottom: 2px; }
            .avg-val-large { font-size: 15pt; letter-spacing: -0.5pt; font-family: sans-serif; } 
            .avg-pulse { font-size: 9pt; color: #555; }
            
            .day-row { 
                display: grid; 
                grid-template-columns: 16mm 1fr; 
                border-bottom: 1px solid #ccc; 
                flex: 1; 
                align-items: stretch; 
            }
            .day-row:last-child { border-bottom: none; } 

            .day-date { 
                font-size: 10.5pt;
                font-weight: bold; 
                text-align: center; 
                background: #f8f9fa;
                border-right: 1px solid #ccc; 
                display: flex; 
                flex-direction: column; 
                align-items: center; 
                justify-content: center; 
            }
            .day-values { 
                display: grid; 
                grid-template-columns: 1fr 1fr; 
                text-align: center; 
            }
            .val-cell {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 1mm;
            }
            .val-m { border-right: 1px dashed #aaa; }
            
            /* 日々の平均値（メイン）と脈拍（サブ）のフォント設定 */
            .bp-main { font-size: 13.5pt; font-weight: bold; line-height: 1.2; margin-bottom: 2mm; }
            .bp-sub { font-size: 10.5pt; font-weight: bold; color: #444; line-height: 1.2; }
            
            .prefix-text { font-size: 9pt; font-weight: normal; color: #666; margin-right: 2px; vertical-align: middle; }
            .suffix-text { font-size: 8.5pt; font-weight: normal; color: #666; margin-left: 2px; }

            .val-m .bp-main { color: #b66a00; } 
            .val-m .bp-sub { color: #b66a00; } 
            .val-e .bp-main { color: #1a5ca3; } 
            .val-e .bp-sub { color: #1a5ca3; } 
        }
    </style>
</head>
<body>

<div class="container" id="top">
    <div class="header"><h1>🩺 血圧記録</h1></div>

    <div class="input-card">
        <input type="date" id="record_date" class="date-input">

        <div class="area-morning">
            <div class="section-title morning-text">☀️ 朝の測定</div>
            <div class="stepper-row">
                <div class="reading-num">①</div>
                <div class="value-control">
                    <button class="step-btn" onclick="step('m1_sys', -1)">-</button>
                    <select id="m1_sys"></select>
                    <button class="step-btn" onclick="step('m1_sys', 1)">+</button>
                </div>
                <div class="value-control">
                    <button class="step-btn" onclick="step('m1_dia', -1)">-</button>
                    <select id="m1_dia"></select>
                    <button class="step-btn" onclick="step('m1_dia', 1)">+</button>
                </div>
                <div class="value-control">
                    <span class="pulse-label">脈</span>
                    <select id="m1_pulse" style="width:55px;"></select>
                </div>
            </div>
            <div class="stepper-row">
                <div class="reading-num">②</div>
                <div class="value-control">
                    <button class="step-btn" onclick="step('m2_sys', -1)">-</button>
                    <select id="m2_sys"></select>
                    <button class="step-btn" onclick="step('m2_sys', 1)">+</button>
                </div>
                <div class="value-control">
                    <button class="step-btn" onclick="step('m2_dia', -1)">-</button>
                    <select id="m2_dia"></select>
                    <button class="step-btn" onclick="step('m2_dia', 1)">+</button>
                </div>
                <div class="value-control">
                    <span class="pulse-label">脈</span>
                    <select id="m2_pulse" style="width:55px;"></select>
                </div>
            </div>
        </div>

        <div class="area-evening">
            <div class="section-title evening-text">🌙 夜の測定</div>
            <div class="stepper-row">
                <div class="reading-num">①</div>
                <div class="value-control">
                    <button class="step-btn" onclick="step('e1_sys', -1)">-</button>
                    <select id="e1_sys"></select>
                    <button class="step-btn" onclick="step('e1_sys', 1)">+</button>
                </div>
                <div class="value-control">
                    <button class="step-btn" onclick="step('e1_dia', -1)">-</button>
                    <select id="e1_dia"></select>
                    <button class="step-btn" onclick="step('e1_dia', 1)">+</button>
                </div>
                <div class="value-control">
                    <span class="pulse-label">脈</span>
                    <select id="e1_pulse" style="width:55px;"></select>
                </div>
            </div>
            <div class="stepper-row">
                <div class="reading-num">②</div>
                <div class="value-control">
                    <button class="step-btn" onclick="step('e2_sys', -1)">-</button>
                    <select id="e2_sys"></select>
                    <button class="step-btn" onclick="step('e2_sys', 1)">+</button>
                </div>
                <div class="value-control">
                    <button class="step-btn" onclick="step('e2_dia', -1)">-</button>
                    <select id="e2_dia"></select>
                    <button class="step-btn" onclick="step('e2_dia', 1)">+</button>
                </div>
                <div class="value-control">
                    <span class="pulse-label">脈</span>
                    <select id="e2_pulse" style="width:55px;"></select>
                </div>
            </div>
        </div>

        <button class="save-button" onclick="addRecord()">💾 記録を保存</button>

        <div class="tool-buttons">
            <button class="tool-btn btn-print" onclick="showPrintDialog()">🖨️ 印刷</button>
            <button class="tool-btn btn-export" onclick="exportToCSV()">📊 出力</button>
            <button class="tool-btn btn-import" onclick="document.getElementById('csvFile').click()">📥 取込</button>
        </div>
        <input type="file" id="csvFile" accept=".csv,text/csv" style="display:none" onchange="importFromCSV(this)">
        <div id="storageStatus" class="storage-status">保存領域を確認しています…</div>
    </div>

    <div class="history-section">
        <h3 style="margin-bottom: 10px; font-size: 0.9rem;">📋 履歴 (タップで詳細)</h3>
        <div id="historyList"></div>
    </div>
</div>

<div class="print-dialog-overlay" id="printDialog">
    <div class="print-dialog">
        <h3 style="margin-bottom:15px;">🖨️ 印刷設定</h3>
        <div style="margin-bottom:12px;">
            <label>開始日</label><input type="date" id="printStartDate" class="date-input" style="margin-top:5px;">
        </div>
        <div style="margin-bottom:12px;">
            <label>終了日</label><input type="date" id="printEndDate" class="date-input" style="margin-top:5px;">
        </div>
        <div class="tool-buttons">
            <button class="tool-btn" style="background:#eee;color:black;" onclick="closePrintDialog()">閉じる</button>
            <button class="tool-btn btn-print" style="grid-column: span 2;" onclick="executePrint()">印刷実行</button>
        </div>
    </div>
</div>

<div id="printContainer"></div>

<script>
    const STORAGE_KEY = 'bp_records_integrated';
    const BACKUP_KEY = 'bp_records_integrated_backup';
    const BACKUP_DATE_KEY = 'bp_records_last_export';
    const DB_NAME = 'bp_record_database';
    const DB_STORE = 'app_data';
    const DB_RECORD_KEY = 'records';
    let records = [];
    let storageDb = null;
    let lastSavedAt = null;

    function isRecordArray(value) {
        return Array.isArray(value) && value.every(r =>
            r && typeof r.fullDate === 'string' &&
            Array.isArray(r.m1) && r.m1.length >= 3 &&
            Array.isArray(r.m2) && r.m2.length >= 3 &&
            Array.isArray(r.e1) && r.e1.length >= 3 &&
            Array.isArray(r.e2) && r.e2.length >= 3
        );
    }

    function unpackPayload(value) {
        if (isRecordArray(value)) return { records: value, updatedAt: 0 };
        if (value && isRecordArray(value.records)) {
            return { records: value.records, updatedAt: Number(value.updatedAt) || 0 };
        }
        return null;
    }

    function readLocalPayload(key) {
        try {
            const raw = localStorage.getItem(key);
            return raw ? unpackPayload(JSON.parse(raw)) : null;
        } catch (error) {
            console.error(`${key} の読み込みに失敗しました:`, error);
            return null;
        }
    }

    function openStorageDb() {
        return new Promise((resolve, reject) => {
            if (!('indexedDB' in window)) return resolve(null);
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = () => {
                const db = request.result;
                if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    function readDbPayload() {
        return new Promise((resolve, reject) => {
            if (!storageDb) return resolve(null);
            const request = storageDb.transaction(DB_STORE, 'readonly')
                .objectStore(DB_STORE).get(DB_RECORD_KEY);
            request.onsuccess = () => resolve(unpackPayload(request.result));
            request.onerror = () => reject(request.error);
        });
    }

    function writeDbPayload(payload) {
        return new Promise((resolve, reject) => {
            if (!storageDb) return resolve(false);
            const request = storageDb.transaction(DB_STORE, 'readwrite')
                .objectStore(DB_STORE).put(payload, DB_RECORD_KEY);
            request.onsuccess = () => resolve(true);
            request.onerror = () => reject(request.error);
        });
    }

    function setStorageStatus(message, type = '') {
        const el = document.getElementById('storageStatus');
        el.textContent = message;
        el.className = `storage-status${type ? ` ${type}` : ''}`;
    }

    function localDateTime(timestamp) {
        if (!timestamp) return '未保存';
        return new Date(timestamp).toLocaleString('ja-JP', {
            month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
    }

    function updateStorageStatus(type = '') {
        const lastExport = Number(localStorage.getItem(BACKUP_DATE_KEY)) || 0;
        const days = lastExport ? Math.floor((Date.now() - lastExport) / 86400000) : null;
        let message = `端末内に${records.length}件保存・最終保存 ${localDateTime(lastSavedAt)}`;
        if (days === null) {
            message += '／CSVバックアップは未作成です';
            type = type || 'warning';
        } else if (days >= 7) {
            message += `／CSVバックアップから${days}日経過`;
            type = type || 'warning';
        } else {
            message += `／CSVバックアップ ${days}日前`;
        }
        setStorageStatus(message, type);
    }

    async function requestPersistentStorage() {
        try {
            if (navigator.storage?.persist) await navigator.storage.persist();
        } catch (error) {
            console.warn('永続ストレージの申請に失敗しました:', error);
        }
    }

    async function initializeStorage() {
        const primary = readLocalPayload(STORAGE_KEY);
        const backup = readLocalPayload(BACKUP_KEY);
        let dbPayload = null;

        try {
            storageDb = await openStorageDb();
            dbPayload = await readDbPayload();
        } catch (error) {
            console.error('IndexedDBの初期化に失敗しました:', error);
        }

        const candidates = [primary, backup, dbPayload].filter(Boolean);
        const newest = candidates.sort((a, b) => b.updatedAt - a.updatedAt)[0];
        if (newest) {
            records = newest.records;
            lastSavedAt = newest.updatedAt || Date.now();
        }

        renderHistory();
        updateStorageStatus(!primary && backup ? 'warning' : '');

        // 旧localStorage形式からの移行、または片方の保存先が空の場合のみ同期する。
        if (newest && (!primary || !dbPayload)) {
            await persistRecords(false);
        }
        requestPersistentStorage();
    }

    async function persistRecords(keepPrevious = true) {
        const payload = {
            version: 2,
            updatedAt: Date.now(),
            records: records
        };

        try {
            if (keepPrevious) {
                const previous = localStorage.getItem(STORAGE_KEY);
                if (previous) {
                    try {
                        if (unpackPayload(JSON.parse(previous))) localStorage.setItem(BACKUP_KEY, previous);
                    } catch (error) {
                        console.warn('破損した主保存データは予備領域へコピーしませんでした。');
                    }
                }
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            await writeDbPayload(payload);
            lastSavedAt = payload.updatedAt;
            updateStorageStatus();
            requestPersistentStorage();
            return true;
        } catch (error) {
            console.error('記録の保存に失敗しました:', error);
            setStorageStatus('保存に失敗しました。CSV出力で退避してください。', 'error');
            return false;
        }
    }

    function createOptions(id, min, max, def) {
        const sel = document.getElementById(id);
        if(!sel) return;
        sel.innerHTML = '';
        for(let i=max; i>=min; i--) {
            const opt = document.createElement('option');
            opt.value = i; opt.textContent = i;
            if(i === def) opt.selected = true;
            sel.appendChild(opt);
        }
    }

    ['m1','m2','e1','e2'].forEach(p => {
        createOptions(p+'_sys', 70, 220, 125);
        createOptions(p+'_dia', 40, 140, 80);
        createOptions(p+'_pulse', 40, 140, 70);
    });

    const today = new Date();
    document.getElementById('record_date').value = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');

    function step(id, val) {
        const el = document.getElementById(id);
        const nextVal = parseInt(el.value) + val;
        const opt = el.querySelector(`option[value="${nextVal}"]`);
        if(opt) el.value = nextVal;
    }

    async function addRecord() {
        const dateVal = document.getElementById('record_date').value;
        if (!isValidDateString(dateVal)) {
            alert('記録日を指定してください');
            return;
        }
        const entry = {
            id: Date.now(),
            fullDate: dateVal,
            m1: [parseInt(document.getElementById('m1_sys').value), parseInt(document.getElementById('m1_dia').value), parseInt(document.getElementById('m1_pulse').value)],
            m2: [parseInt(document.getElementById('m2_sys').value), parseInt(document.getElementById('m2_dia').value), parseInt(document.getElementById('m2_pulse').value)],
            e1: [parseInt(document.getElementById('e1_sys').value), parseInt(document.getElementById('e1_dia').value), parseInt(document.getElementById('e1_pulse').value)],
            e2: [parseInt(document.getElementById('e2_sys').value), parseInt(document.getElementById('e2_dia').value), parseInt(document.getElementById('e2_pulse').value)]
        };
        records = records.filter(r => r.fullDate !== dateVal);
        records.unshift(entry);
        records.sort((a,b) => new Date(b.fullDate) - new Date(a.fullDate));
        const saved = await saveAndRender();
        if (saved) alert('端末内の2か所に保存しました');
    }

    function loadToInputs(id) {
        const r = records.find(item => item.id === id);
        if (!r) return;
        if (confirm(`${r.fullDate} のデータを入力欄に反映しますか？`)) {
            document.getElementById('record_date').value = r.fullDate;
            const setVal = (id, val) => {
                const el = document.getElementById(id);
                if (val !== undefined && val !== null && el.querySelector(`option[value="${val}"]`)) {
                    el.value = val;
                }
            };
            setVal('m1_sys', r.m1[0]); setVal('m1_dia', r.m1[1]); setVal('m1_pulse', r.m1[2]);
            setVal('m2_sys', r.m2[0]); setVal('m2_dia', r.m2[1]); setVal('m2_pulse', r.m2[2]);
            setVal('e1_sys', r.e1[0]); setVal('e1_dia', r.e1[1]); setVal('e1_pulse', r.e1[2]);
            setVal('e2_sys', r.e2[0]); setVal('e2_dia', r.e2[1]); setVal('e2_pulse', r.e2[2]);
            document.getElementById('top').scrollIntoView({behavior: 'smooth'});
        }
    }

    async function saveAndRender() {
        renderHistory();
        return await persistRecords();
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        if (records.length === 0) {
            list.innerHTML = '<div style="text-align:center;color:#999;padding:20px;">データがありません</div>';
            return;
        }
        list.innerHTML = records.map(r => {
            const dParts = r.fullDate.split('-');
            const p = (val) => val || '--';
            return `
                <div class="history-item" onclick="this.classList.toggle('open')">
                    <div class="history-summary">
                        <div class="history-date">${parseInt(dParts[1])}/${parseInt(dParts[2])}</div>
                        <div class="sum-val morning-text">${r.m1[0]}/${r.m1[1]}</div>
                        <div class="sum-val evening-text">${r.e1[0]}/${r.e1[1]}</div>
                        <button class="delete-btn" onclick="event.stopPropagation(); deleteRecord(${r.id})">×</button>
                    </div>
                    <div class="history-details">
                        <p>朝②: ${r.m2[0]}/${r.m2[1]} (脈:${p(r.m2[2])}) | 夜②: ${r.e2[0]}/${r.e2[1]} (脈:${p(r.e2[2])})</p>
                        <p>脈拍① 朝:${p(r.m1[2])} / 夜:${p(r.e1[2])}</p>
                        <button class="reflect-btn" onclick="event.stopPropagation(); loadToInputs(${r.id})">このデータを入力欄に戻す</button>
                    </div>
                </div>`;
        }).join('');
    }

    async function deleteRecord(id) {
        if(confirm('この記録を削除しますか？')) {
            records = records.filter(r => r.id !== id);
            await saveAndRender();
        }
    }

    function exportToCSV(silent = false) {
        let csv = "日付,朝1高,朝1低,朝1脈,朝2高,朝2低,朝2脈,夜1高,夜1低,夜1脈,夜2高,夜2低,夜2脈\n";
        records.forEach(r => {
            const v = value => Number.isFinite(Number(value)) && Number(value) > 0 ? value : '';
            csv += `${r.fullDate},${v(r.m1[0])},${v(r.m1[1])},${v(r.m1[2])},${v(r.m2[0])},${v(r.m2[1])},${v(r.m2[2])},${v(r.e1[0])},${v(r.e1[1])},${v(r.e1[2])},${v(r.e2[0])},${v(r.e2[1])},${v(r.e2[2])}\n`;
        });
        const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], {type:'text/csv;charset=utf-8'});
        const a = document.createElement('a');
        const now = new Date();
        a.download = `血圧 ${now.getMonth()+1}月 ${now.getDate()}日保存.csv`;
        const url = URL.createObjectURL(blob);
        a.href = url;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        localStorage.setItem(BACKUP_DATE_KEY, String(Date.now()));
        updateStorageStatus();
        if (!silent) setStorageStatus(`CSVバックアップを作成しました（${records.length}件）`);
    }

    async function importFromCSV(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async function(e) {
            const lines = e.target.result.split(/\r\n|\n/);
            let count = 0;
            let skipped = 0;
            const previousRecords = JSON.parse(JSON.stringify(records));
            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(',');
                if (cols.length < 13) {
                    if (lines[i].trim()) skipped++;
                    continue;
                }
                const date = normalizeDate(cols[0].trim());
                const n = (v) => {
                    const x = Number.parseInt(String(v).trim(), 10);
                    return Number.isFinite(x) ? x : null;
                };
                const values = cols.slice(1, 13).map(n);
                const requiredIndexes = [0, 1, 3, 4, 6, 7, 9, 10];
                const validDate = isValidDateString(date);
                const validRequired = requiredIndexes.every(index => {
                    const value = values[index];
                    const isSys = [0, 3, 6, 9].includes(index);
                    return value !== null && value >= (isSys ? 70 : 40) && value <= (isSys ? 220 : 140);
                });
                const validOptional = [2, 5, 8, 11].every(index =>
                    values[index] === null || (values[index] >= 40 && values[index] <= 140)
                );
                if (!validDate || !validRequired || !validOptional) {
                    skipped++;
                    continue;
                }
                const entry = {
                    id: Date.now() + i,
                    fullDate: date,
                    m1: values.slice(0, 3),
                    m2: values.slice(3, 6),
                    e1: values.slice(6, 9),
                    e2: values.slice(9, 12)
                };
                records = records.filter(r => r.fullDate !== entry.fullDate);
                records.push(entry);
                count++;
            }
            if (count === 0) {
                records = previousRecords;
                input.value = '';
                alert(`取り込める記録がありませんでした${skipped ? `（${skipped}行を除外）` : ''}`);
                return;
            }

            records.sort((a,b) => new Date(b.fullDate) - new Date(a.fullDate));
            const saved = await saveAndRender();
            input.value = '';
            if (saved) alert(`${count}件取り込みました${skipped ? `（${skipped}行を除外）` : ''}`);
        };
        reader.onerror = () => {
            input.value = '';
            alert('CSVファイルを読み込めませんでした');
        };
        reader.readAsText(file);
    }

    function showPrintDialog() {
        document.getElementById('printDialog').style.display = 'flex';
        if (records.length > 0) {
            const validDates = records.map(r => normalizeDate(r.fullDate)).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d));
            validDates.sort();
            document.getElementById('printStartDate').value = validDates[0] || '';
            document.getElementById('printEndDate').value = validDates[validDates.length - 1] || '';
        }
    }
    function closePrintDialog() { document.getElementById('printDialog').style.display = 'none'; }

    // 日付マッチング用正規化関数 (2025-12-1 と 2025-12-01 両方対応)
    function normalizeDate(dStr) {
        if (!dStr) return "";
        const parts = dStr.split('-');
        if (parts.length !== 3) return dStr;
        return `${parts[0]}-${String(parts[1]).padStart(2,'0')}-${String(parts[2]).padStart(2,'0')}`;
    }

    function isValidDateString(dStr) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(dStr)) return false;
        const [year, month, day] = dStr.split('-').map(Number);
        const date = new Date(year, month - 1, day);
        return date.getFullYear() === year &&
            date.getMonth() === month - 1 &&
            date.getDate() === day;
    }

    function executePrint() {
        const startVal = document.getElementById('printStartDate').value;
        const endVal = document.getElementById('printEndDate').value;
        if (!startVal || !endVal) return alert('日付を指定してください');

        const start = new Date(startVal.replace(/-/g, '/') + " 00:00:00");
        const end = new Date(endVal.replace(/-/g, '/') + " 00:00:00");
        if (start > end) return alert('終了日は開始日以降を指定してください');
        
        // データを正規化してマップ化 (12-1 と 12-01 の混在を解決)
        const recordMap = {};
        records.forEach(r => recordMap[normalizeDate(r.fullDate)] = r);

        let html = '';
        let current = new Date(start);
        current.setDate(current.getDate() - current.getDay()); // 日曜日に合わせる

        const weeks = [];
        while (current <= end) {
            const week = { start: new Date(current), days: [] };
            for (let i = 0; i < 7; i++) {
                const dStr = normalizeDate(`${current.getFullYear()}-${current.getMonth()+1}-${current.getDate()}`);
                const inRange = current >= start && current <= end;
                week.days.push({ date: new Date(current), data: inRange ? (recordMap[dStr] || null) : null });
                current.setDate(current.getDate() + 1);
            }
            weeks.push(week);
        }

        // 4週間ごとにページを分ける
        for (let p = 0; p < Math.ceil(weeks.length / 4); p++) {
            html += `<div class="print-page">`;
            weeks.slice(p * 4, (p + 1) * 4).forEach(w => {
                let mSumS = 0, mSumD = 0, mSumP = 0, mCount = 0, mPCount = 0;
                let eSumS = 0, eSumD = 0, eSumP = 0, eCount = 0, ePCount = 0;
                
                const pairAverage = (a, b) => {
                    const values = [a, b].map(Number).filter(v => Number.isFinite(v) && v > 0);
                    return values.length ? values.reduce((sum, v) => sum + v, 0) / values.length : null;
                };
                w.days.forEach(d => { if (d.data) {
                    const mS = pairAverage(d.data.m1[0], d.data.m2[0]);
                    const mD = pairAverage(d.data.m1[1], d.data.m2[1]);
                    const mP = pairAverage(d.data.m1[2], d.data.m2[2]);
                    const eS = pairAverage(d.data.e1[0], d.data.e2[0]);
                    const eD = pairAverage(d.data.e1[1], d.data.e2[1]);
                    const eP = pairAverage(d.data.e1[2], d.data.e2[2]);
                    if (mS !== null && mD !== null) {
                        mSumS += mS; mSumD += mD; mCount++;
                        if (mP !== null) { mSumP += mP; mPCount++; }
                    }
                    if (eS !== null && eD !== null) {
                        eSumS += eS; eSumD += eD; eCount++;
                        if (eP !== null) { eSumP += eP; ePCount++; }
                    }
                }});
                
                const avgItem = (label, s, d, p, c, pCount, color) => {
                    const pulse = pCount > 0 ? ` <span class="avg-pulse">(脈:${Math.round(p/pCount)})</span>` : '';
                    const val = c > 0 ? `<div style="color:${color};"><span class="avg-val-large">${Math.round(s/c)}/${Math.round(d/c)}</span>${pulse}</div>` : '<div class="avg-val-large">--</div>';
                    return `<div class="avg-item"><span class="avg-label">${label}</span>${val}</div>`;
                };

                // 第何週かを計算 (1月1日が含まれる週を第1週とする)
                const sat = new Date(w.start);
                sat.setDate(sat.getDate() + 6); // その週の土曜日を基準にして年を判定
                const jan1 = new Date(sat.getFullYear(), 0, 1);
                const jan1Sun = new Date(jan1);
                jan1Sun.setDate(jan1.getDate() - jan1.getDay()); // 1月1日が含まれる週の日曜日
                const weekNum = Math.round((w.start.getTime() - jan1Sun.getTime()) / 604800000) + 1; // 604800000ms = 7日間

                html += `<div class="week-group">
                    <div class="weekly-summary">
                        <div class="week-title">${w.start.getMonth()+1}/${w.start.getDate()} 週 (第${weekNum}週) の全体平均</div>
                        <div class="avg-row">
                            ${avgItem('朝平均', mSumS, mSumD, mSumP, mCount, mPCount, '#b66a00')}
                            ${avgItem('夜平均', eSumS, eSumD, eSumP, eCount, ePCount, '#1a5ca3')}
                        </div>
                    </div>`;
                    
                w.days.forEach(d => {
                    const r = d.data;
                    const dayStr = ['日','月','火','水','木','金','土'][d.date.getDay()];
                    
                    let mHtml = '<div class="val-cell val-m">--</div>';
                    let eHtml = '<div class="val-cell val-e">--</div>';
                    
                    if (r) {
                        // 日々の平均値を計算
                        const mSysAvg = pairAverage(r.m1[0], r.m2[0]);
                        const mDiaAvg = pairAverage(r.m1[1], r.m2[1]);
                        const mPlsAvg = pairAverage(r.m1[2], r.m2[2]);
                        
                        const eSysAvg = pairAverage(r.e1[0], r.e2[0]);
                        const eDiaAvg = pairAverage(r.e1[1], r.e2[1]);
                        const ePlsAvg = pairAverage(r.e1[2], r.e2[2]);

                        mHtml = `<div class="val-cell val-m">
                                    <div class="bp-main"><span class="prefix-text">[平均]</span>${Math.round(mSysAvg)}/${Math.round(mDiaAvg)}</div>
                                    <div class="bp-sub">${mPlsAvg === null ? '--' : Math.round(mPlsAvg)}<span class="suffix-text">[拍/分]</span></div>
                                 </div>`;
                        eHtml = `<div class="val-cell val-e">
                                    <div class="bp-main"><span class="prefix-text">[平均]</span>${Math.round(eSysAvg)}/${Math.round(eDiaAvg)}</div>
                                    <div class="bp-sub">${ePlsAvg === null ? '--' : Math.round(ePlsAvg)}<span class="suffix-text">[拍/分]</span></div>
                                 </div>`;
                    }
                    
                    html += `
                        <div class="day-row">
                            <div class="day-date"><span>${d.date.getMonth()+1}/${d.date.getDate()}</span><span style="font-size:0.8em;">(${dayStr})</span></div>
                            <div class="day-values">
                                ${mHtml}
                                ${eHtml}
                            </div>
                        </div>`;
                });
                html += `</div>`;
            });
            html += `</div>`;
        }
        document.getElementById('printContainer').innerHTML = html;
        closePrintDialog();
        setTimeout(() => { window.print(); }, 500);
    }

    initializeStorage();

    // PWA用サービスワーカーを登録する。
    // GitHub Pagesのプロジェクト配下でも動作するよう相対パスを使用する。
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(error => {
                console.error('サービスワーカーの登録に失敗しました:', error);
            });
        });
    }
</script>
